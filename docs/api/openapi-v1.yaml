    post:
      operationId: financial_records_entity_import_post
      description: |-
        Upload a statement CSV; it becomes a draft with proposed codes (MVP step 4).

        The draft is then reviewed and validated like any other (step 3).
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: A client-generated UUID. Repeating it with the same request returns
          the original result; with a different request, 409.
      - in: path
