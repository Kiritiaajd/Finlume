name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include real financial data, credentials or personal information.**
        Reproduce with made-up figures. Security vulnerabilities must be reported
        privately; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, using fictional data.
    validations:
      required: true
  - type: textarea
    id: calculation
    attributes:
      label: Incorrect calculation? (optional)
      description: Inputs, the value Finlume produced, the value you expected and how you derived it.
  - type: input
    id: version
    attributes:
      label: Finlume version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, database, browser if relevant.
