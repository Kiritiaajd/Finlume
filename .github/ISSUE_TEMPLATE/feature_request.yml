name: Feature request
description: Suggest a capability or improvement.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and who is affected (individual, business, investor)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: >-
        Check docs/product/PRODUCT_SCOPE.md. Is this part of the MVP, a planned phase, or new?
