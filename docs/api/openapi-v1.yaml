components:
  schemas:
    AnalysisRequestRequest:
      type: object
      description: The reporting period to analyse; every statement type of it is
        used.
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        period_type:
          $ref: '#/components/schemas/PeriodTypeEnum'
      required:
      - period_end
      - period_start
      - period_type
    CredentialsRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        personal_workspace_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
      required:
      - email
      - id
      - personal_workspace_id
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/DocumentKindEnum'
        filename:
          type: string
          nullable: true
        size_bytes:
          type: integer
          nullable: true
        sha256:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - filename
      - id
      - kind
      - sha256
      - size_bytes
    DocumentKindEnum:
      enum:
      - manual_entry
      - csv_upload
      type: string
      description: |-
        * `manual_entry` - Manual entry
        * `csv_upload` - CSV upload
    Entity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        default_currency:
          type: string
          nullable: true
        fiscal_year_end_month:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - default_currency
      - entity_type
      - fiscal_year_end_month
      - id
      - name
    EntityInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        default_currency:
          oneOf:
          - type: string
            default: ''
            maxLength: 3
            pattern: ^[A-Z]{3}$
          - type: string
            maxLength: 0
        fiscal_year_end_month:
          type: integer
          maximum: 12
          minimum: 1
          nullable: true
      required:
      - entity_type
      - name
    EntityTypeEnum:
      enum:
      - business
      - individual
      - listed_company
      type: string
      description: |-
        * `business` - Business
        * `individual` - Individual
        * `listed_company` - Listed company
    Fact:
      type: object
      description: A normalised figure in base units, as a decimal string, traced
        to its row.
      properties:
        line_item:
          $ref: '#/components/schemas/LineItemCodeEnum'
        value:
          type: string
        row_id:
          type: string
          format: uuid
        review_status:
          $ref: '#/components/schemas/ReviewStatusEnum'
      required:
      - line_item
      - review_status
      - row_id
      - value
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        checks:
          $ref: '#/components/schemas/HealthChecks'
      required:
      - checks
      - status
    HealthChecks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - database
    HealthStatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    ImportWarning:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ImportWarningCodeEnum'
        message:
          type: string
        document_id:
          type: string
          format: uuid
      required:
      - code
      - document_id
      - message
    ImportWarningCodeEnum:
      enum:
      - duplicate_file
      type: string
      description: '* `duplicate_file` - duplicate_file'
    Issue:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/IssueCodeEnum'
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        message:
          type: string
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/LineItemCodeEnum'
      required:
      - code
      - line_items
      - message
      - severity
    IssueCodeEnum:
      enum:
      - missing_input
      - zero_denominator
      - negative_denominator
      - unexpected_sign
      - balance_sheet_imbalance
      - subtotal_mismatch
      - result_out_of_range
      type: string
      description: |-
        * `missing_input` - missing_input
        * `zero_denominator` - zero_denominator
        * `negative_denominator` - negative_denominator
        * `unexpected_sign` - unexpected_sign
        * `balance_sheet_imbalance` - balance_sheet_imbalance
        * `subtotal_mismatch` - subtotal_mismatch
        * `result_out_of_range` - result_out_of_range
    LineItem:
      type: object
      description: A raw row as entered; ``amount`` is in the reported scale, as a
        decimal string.
      properties:
        id:
          type: string
          format: uuid
        row_number:
          type: integer
        label:
          type: string
        line_item_code:
          allOf:
          - $ref: '#/components/schemas/LineItemCodeEnum'
          nullable: true
        amount:
          type: string
          nullable: true
        raw_value:
          type: string
        source_reference:
          type: string
          nullable: true
      required:
      - amount
      - id
      - label
      - line_item_code
      - raw_value
      - row_number
      - source_reference
    LineItemCodeEnum:
      enum:
      - revenue
      - cost_of_revenue
      - gross_profit
      - operating_expenses
      - operating_income
      - interest_expense
      - income_before_tax
      - income_tax_expense
      - net_income
      - cash_and_cash_equivalents
      - inventories
      - total_current_assets
      - total_assets
      - total_current_liabilities
      - total_liabilities
      - total_debt
      - total_equity
      - net_cash_from_operating_activities
      - capital_expenditure
      - net_cash_from_investing_activities
      - net_cash_from_financing_activities
      type: string
      description: |-
        * `revenue` - revenue
        * `cost_of_revenue` - cost_of_revenue
        * `gross_profit` - gross_profit
        * `operating_expenses` - operating_expenses
        * `operating_income` - operating_income
        * `interest_expense` - interest_expense
        * `income_before_tax` - income_before_tax
        * `income_tax_expense` - income_tax_expense
        * `net_income` - net_income
        * `cash_and_cash_equivalents` - cash_and_cash_equivalents
        * `inventories` - inventories
        * `total_current_assets` - total_current_assets
        * `total_assets` - total_assets
        * `total_current_liabilities` - total_current_liabilities
        * `total_liabilities` - total_liabilities
        * `total_debt` - total_debt
        * `total_equity` - total_equity
        * `net_cash_from_operating_activities` - net_cash_from_operating_activities
        * `capital_expenditure` - capital_expenditure
        * `net_cash_from_investing_activities` - net_cash_from_investing_activities
        * `net_cash_from_financing_activities` - net_cash_from_financing_activities
    LineItemDefinition:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/LineItemCodeEnum'
        statement_type:
          $ref: '#/components/schemas/StatementTypeEnum'
        label:
          type: string
        definition:
          type: string
        sign:
          $ref: '#/components/schemas/SignEnum'
      required:
      - code
      - definition
      - label
      - sign
      - statement_type
    LineItemInputRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 255
        line_item_code:
          allOf:
          - $ref: '#/components/schemas/LineItemCodeEnum'
          default: ''
        amount:
          type: string
          description: A decimal string such as "1250.50" or "-3.25"; never a JSON
            number. At most 6 decimal places and below 10^24.
          example: '1250.50'
          nullable: true
        source_reference:
          type: string
          default: ''
          maxLength: 64
      required:
      - label
    Metric:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/MetricCodeEnum'
        name:
          type: string
        value:
          type: string
          nullable: true
          description: Decimal string; null when not computable, never 0.
        unit:
          $ref: '#/components/schemas/UnitEnum'
        methodology:
          type: string
        inputs:
          type: object
          additionalProperties:
            type: string
