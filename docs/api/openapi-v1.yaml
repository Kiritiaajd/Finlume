        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/WorkspaceRoleEnum'
      required:
      - role
      - user_id
    WorkspaceMemberRoleRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/WorkspaceRoleEnum'
      required:
      - role
    WorkspaceRenameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
    WorkspaceRoleEnum:
      enum:
      - viewer
      - editor
      - owner
      type: string
      description: |-
        * `viewer` - Viewer
        * `editor` - Editor
        * `owner` - Owner
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          - request_id
          properties:
            code:
              type: string
              description: Stable, machine-readable.
            message:
              type: string
              description: Safe to show to users.
            details:
              nullable: true
              description: Field-level errors for validation_error; null otherwise.
            request_id:
              type: string
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
