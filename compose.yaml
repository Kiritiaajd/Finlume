# LOCAL DEVELOPMENT ONLY — a PostgreSQL server for the Django backend.
#
#   docker compose up -d db
#
# Reads POSTGRES_* from the repository's .env (copy .env.example first).
# Not a production deployment: see docs/architecture/SCALABILITY_AND_DEPLOYMENT.md.

name: finlume

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finlume}
      POSTGRES_USER: ${POSTGRES_USER:-finlume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to loopback so the database is not reachable from the network.
      # Host port 55432 by default (matches .env.example), clear of PostgreSQL
      # servers commonly installed on 5432/5433.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
