openapi: 3.0.3
info:
  title: Finlume API
  version: 1 (v1)
  description: Version 1 of the Finlume API. Conventions (errors, pagination, decimals
    as strings, idempotency) are described in docs/api/API_CONVENTIONS.md.
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: accounts_csrf_get
      description: Sets the CSRF cookie that the client echoes in ``X-CSRFToken``
        on writes.
      tags:
      - api
      security:
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: No response body
        4XX:
          description: An error, in the standard envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: An error, in the standard envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login/:
    post:
      operationId: accounts_login_post
      description: 'Base for sign-in and registration: open to anyone, but CSRF-checked.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
        4XX:
          description: An error, in the standard envelope.
